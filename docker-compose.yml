x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: "false"
  DJANGO_HTTPS: "false"          # local only: no TLS in this stack
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
  DJANGO_EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  POSTGRES_DB: tasktrack
  POSTGRES_USER: tasktrack
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tasktrack
      POSTGRES_USER: tasktrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktrack"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build: ./backend
    environment: *django-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 30 --access-logfile -"
    volumes: [static:/app/staticfiles]
    restart: unless-stopped

  worker:
    build: ./backend
    environment: *django-env
    command: celery -A config worker -l info
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports: ["8080:80"]
    volumes:
      - static:/app/staticfiles:ro
    depends_on: [backend]
    restart: unless-stopped
    
volumes:
  pgdata:
  static: